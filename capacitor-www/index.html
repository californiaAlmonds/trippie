<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="refresh" content="0; url=https://trippie-mu.vercel.app" />
    <title>Trippie</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: #0f172a;
        background-color: #eaf1fc;
        background-image:
          radial-gradient(at 15% 20%, rgba(56, 189, 248, 0.55) 0px, transparent 55%),
          radial-gradient(at 85% 25%, rgba(139, 92, 246, 0.48) 0px, transparent 55%),
          radial-gradient(at 50% 85%, rgba(45, 212, 191, 0.42) 0px, transparent 55%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(90vw, 360px);
        padding: 2rem 1.75rem;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.48);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 20px 50px -20px rgba(31, 41, 100, 0.25),
          0 4px 16px -4px rgba(31, 41, 100, 0.08),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        text-align: center;
      }
      .brand {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
        background: linear-gradient(135deg, #0a84ff 0%, #7c5cff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="brand">Trippie</h1>
      <p>Loading Trippie&hellip;</p>
    </main>
    <script>
      window.location.replace("https://trippie-mu.vercel.app");
    </script>
  </body>
</html>
