<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Trippie &mdash; Offline</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: #0f172a;
        background-color: #eaf1fc;
        background-image:
          radial-gradient(at 15% 20%, rgba(56, 189, 248, 0.55) 0px, transparent 55%),
          radial-gradient(at 85% 25%, rgba(139, 92, 246, 0.48) 0px, transparent 55%),
          radial-gradient(at 50% 85%, rgba(45, 212, 191, 0.42) 0px, transparent 55%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        width: min(92vw, 380px);
        padding: 2.25rem 1.75rem;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.48);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 20px 50px -20px rgba(31, 41, 100, 0.25),
          0 4px 16px -4px rgba(31, 41, 100, 0.08),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        text-align: center;
      }
      .icon-badge {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, #0a84ff 0%, #7c5cff 100%);
        box-shadow: 0 10px 24px -6px rgba(10, 132, 255, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-badge svg {
        width: 1.75rem;
        height: 1.75rem;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
        background: linear-gradient(135deg, #0a84ff 0%, #7c5cff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h2 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #0f172a;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.925rem;
        line-height: 1.5;
        color: #475569;
      }
      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 0.875rem;
        padding: 0.75rem 1.5rem;
        width: 100%;
        font-size: 0.95rem;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, #0a84ff 0%, #0066d6 100%);
        box-shadow:
          inset 0 1px 0 0 rgba(255, 255, 255, 0.45),
          0 12px 24px -8px rgba(0, 102, 214, 0.42);
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M22 2L11 13" />
          <path d="M22 2L15 22L11 13L2 9L22 2Z" />
        </svg>
      </div>
      <div class="brand">Trippie</div>
      <h2>You&rsquo;re offline</h2>
      <p>
        Check your internet connection to browse live flight deals and price
        drops.
      </p>
      <button
        type="button"
        onclick="location.href = 'https://trippie-mu.vercel.app'"
      >
        Try again
      </button>
    </main>
  </body>
</html>
