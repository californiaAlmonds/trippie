name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor-www/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trippie-release.jks"
          chmod 600 "$RUNNER_TEMP/trippie-release.jks"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/trippie-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: trippie
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature and rename artifact
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i "certificate SHA-256 digest"
          mv "$APK_PATH" "trippie-${{ github.run_number }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: trippie-${{ github.run_number }}
          path: trippie-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
