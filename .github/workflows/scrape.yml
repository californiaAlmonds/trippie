name: scrape-fares

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST (daily full run)
    - cron: "30 7,13,19 * * *" # 13:00, 19:00, 01:00 IST (alerts-only runs)
  workflow_dispatch:
    inputs:
      route:
        description: "Single route JSON to scrape on demand"
        required: false
        default: ""
        type: string
      limit:
        description: "Max dates per leg (use 3 for a quick spike)"
        required: false
        default: ""

concurrency:
  group: ${{ github.event_name == 'schedule' && 'scrape-scheduled' || format('scrape-route-{0}', inputs.route) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Scrape
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          ROUTE: ${{ inputs.route }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          args=()
          if [ -n "$LIMIT" ]; then
            if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then echo "limit must be a number"; exit 1; fi
            args+=(--limit "$LIMIT")
          fi
          if [ -n "$ROUTE" ]; then
            args+=(--route "$ROUTE")
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_CRON" != "30 1 * * *" ]; then
            args+=(--alerts-only --refresh-age 5)
          fi
          bun scripts/scrape.ts "${args[@]}"
      - name: Send alerts
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.route == ''))
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: bun scripts/alerts.ts
      - name: Upload screenshots of failed pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pages
          path: artifacts/
          if-no-files-found: ignore

